name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        # -race gates against data races (h-wy0a7): without it the telemetry
        # goroutine-vs-test race this fix closes — and any future one — would
        # pass CI unnoticed.
        run: go test ./... -race -v
