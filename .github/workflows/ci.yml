name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        # -race gates against data races (h-wy0a7): without it the telemetry
        # goroutine-vs-test race this fix closes — and any future one — would
        # pass CI unnoticed.
        run: go test ./... -race -v

      - name: Lint workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
